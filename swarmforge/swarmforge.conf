# Format: window <role> <agent> <worktree> [task|batch] [extra-cli-args...]
# The optional receive mode defaults to task. Use batch for roles that should
# consume all currently queued equal-priority handoffs as one batch.
# Any fields after the receive mode are passed to the agent CLI. SwarmForge
# enforces its sandbox and approval flags after these optional arguments.
window specifier codex master task --model gpt-5.6-sol -c model_reasoning_effort=xhigh
window coder codex coder task --model gpt-5.6-sol -c model_reasoning_effort=medium
window refactorer codex refactorer task --model gpt-5.6-sol -c model_reasoning_effort=medium
window architect codex architect batch --model gpt-5.6-sol -c model_reasoning_effort=high
